<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Home Sculpt Pilates Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="figures.js"></script>
<style>
:root{
  --pink:#F45B9B;--pink-dark:#E03F84;--pink-soft:#FDEEF4;--pink-line:#F9C9DC;
  --green:#22B07D;--green-soft:#E8F7F1;--orange-soft:#FFF4E5;--red-soft:#FDECEC;
  --text:#1E1E24;--muted:#7A7A85;--line:#ECECF0;--card:#F5F5F7;--illus:#F7F3F5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:#fff}
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;padding:0 6px}
.hdr button{background:none;border:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.hdr button[hidden]{visibility:hidden;display:flex}
.hdr .mid{text-align:center}
.brand{font-weight:800;font-size:17px;letter-spacing:-.2px}
.sec{font-weight:600;font-size:14px}
.prog{display:flex;gap:4px;justify-content:center;margin-top:5px}
.prog i{width:28px;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.prog i b{position:absolute;left:0;top:0;bottom:0;background:var(--text);transition:width .3s}
main{flex:1;padding:4px 16px 130px}
.screen{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.q{font-size:25px;font-weight:800;text-align:center;line-height:1.22;margin:14px 0 6px;letter-spacing:-.3px}
h1.i{font-size:25px;font-weight:800;line-height:1.22;margin:14px 0 12px;letter-spacing:-.3px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.txt{color:#55555E;font-size:15px;margin-bottom:12px}
.txt b{color:var(--text)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:2px solid transparent;border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.opt:hover{border-color:var(--pink-line)}
.opt.sel{border-color:var(--pink);background:var(--pink-soft)}
.opt .ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.opt .lbl{flex:1;font-weight:600;font-size:15.5px}
.opt .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid #C8C8D0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mark.box{border-radius:6px}
.sel .mark{border-color:var(--pink);background:var(--pink)}
.sel .mark::after{content:"";width:9px;height:5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.grp{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin:10px 0 -2px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.card{border-radius:14px;overflow:hidden;background:var(--illus);cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--pink)}
.card .art{aspect-ratio:4/5;display:flex;align-items:flex-end;justify-content:center;padding:10px 6px 0;overflow:hidden}
.card .art.pose{aspect-ratio:4/3;align-items:center;padding:6px}
.card .art>svg{width:100%;height:100%}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .bar{background:var(--pink);color:#fff;font-weight:700;font-size:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.card .bar i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.card .bar.plain{background:#fff;color:var(--text);justify-content:center}
.card.sel .bar.plain{background:var(--pink);color:#fff}
.legal{text-align:center;font-size:12.5px;color:#55555E;margin-top:18px}
.legal a{color:#3B5BDB}
.age-title{text-align:center;font-weight:800;font-size:13px;letter-spacing:.8px;color:var(--pink);margin-top:10px}
.age-h{text-align:center;font-size:24px;font-weight:800;margin:6px 0 2px;line-height:1.2}
.illus{background:var(--illus);border-radius:16px;margin-top:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.illus>svg{width:100%;height:auto;display:block}
.illus img{width:100%;display:block}
.zwrap{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:center;margin-top:18px}
.zwrap .opts{margin-top:0}
.zwrap .opt{padding:12px}
.zfig{background:var(--illus);border-radius:16px;padding:10px 6px 0;height:100%;display:flex;align-items:flex-end}
.zfig>svg{width:100%}
.zone{opacity:0;transition:opacity .2s}.zone.on{opacity:1}
.units{display:flex;justify-content:center;margin:16px 0 22px}
.units div{display:flex;background:var(--card);border-radius:999px;padding:4px}
.units button{border:0;background:none;padding:8px 22px;border-radius:999px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.units button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nums{display:flex;gap:12px;justify-content:center}
.num{display:flex;align-items:baseline;justify-content:center;gap:6px;border-bottom:2px solid var(--line);padding:6px 4px;min-width:110px}
.num:focus-within{border-color:var(--pink)}
.num input{border:0;outline:0;font:inherit;font-size:34px;font-weight:700;width:100px;text-align:center;color:var(--text);background:none}
.num input::placeholder{color:#C8C8D0}
.num span{color:var(--muted);font-weight:600}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;min-height:18px}
.hint.err{color:#D9480F}
.fb{display:flex;gap:12px;border-radius:14px;padding:14px;margin-top:22px;font-size:14px;color:#44444C}
.fb b{display:block;color:var(--text);margin-bottom:3px}
.fb .fi{font-size:20px;line-height:1}
.fb.ok{background:var(--green-soft)}.fb.warn{background:var(--orange-soft)}.fb.info{background:var(--pink-soft)}.fb.bad{background:var(--red-soft)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#55555E;margin-top:28px;cursor:pointer}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--pink);flex-shrink:0}
.consent a{color:#3B5BDB}
.wp{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.wp-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff}
.bmibar{position:relative;height:8px;border-radius:4px;margin:26px 0 8px;background:linear-gradient(90deg,#4DABF7 0%,#22B07D 30%,#FAB005 62%,#F03E3E 100%)}
.bmibar .pin{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--text);transform:translate(-50%,-50%)}
.bmibar .tag{position:absolute;bottom:16px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.bmilbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:600}
.wp-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:14px;align-items:end}
.stat{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.stat .si{width:34px;height:34px;border-radius:10px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:14px}
.wp-fig{background:var(--illus);border-radius:14px;padding:8px 4px 0}
.chart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px 6px;margin-top:16px}
.chart>svg{width:100%;display:block}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
.ring{position:relative;width:170px;height:170px;margin:26px auto 12px}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
.steps{margin:18px auto 0;max-width:300px}
.steps div{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);font-size:14.5px;transition:color .3s}
.steps div i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;transition:all .3s}
.steps div.done{color:var(--text)}
.steps div.done i{background:var(--green);border-color:var(--green)}
.tst{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:22px;min-height:120px;animation:fade .4s}
.tst .stars{color:#FFB800;letter-spacing:2px}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:15px 14px;font:inherit;font-size:16px;margin-top:20px;outline:0}
.field:focus{border-color:var(--pink)}
.privacy{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:12px}
.privacy a{color:#3B5BDB}
.scratch{position:relative;width:220px;height:280px;margin:30px auto 0;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(244,91,155,.25)}
.scratch .prize{position:absolute;inset:0;background:#fff;border:3px dashed var(--pink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.prize b{font-size:48px;font-weight:800;color:var(--pink);line-height:1}
.prize span{font-weight:700;margin-top:6px}
.scratch canvas{position:absolute;inset:0;touch-action:none;cursor:grab}
.modal{position:fixed;inset:0;background:rgba(20,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .3s}
.modal .box{background:#fff;border-radius:20px;padding:28px 22px;max-width:360px;width:100%;text-align:center}
.modal h3{font-size:22px;font-weight:800;margin:8px 0}
.modal .big{font-size:52px;font-weight:800;color:var(--pink);line-height:1.1}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px 22px;background:linear-gradient(rgba(255,255,255,0),#fff 35%);z-index:10}
.foot>div{max-width:448px;margin:0 auto}
.btn{display:block;width:100%;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:16px 20px;font:inherit;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;text-align:center;text-decoration:none;transition:background .2s,opacity .2s}
.btn:hover{background:var(--pink-dark)}
.btn:disabled{opacity:.4;cursor:default;background:var(--pink)}
.skip{display:block;margin:12px auto 0;background:none;border:0;font:inherit;font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;cursor:pointer}
</style>
</head>

let cur = 0; const hist = [];
const main = $('#main'), foot = $('#foot'), footIn = $('#foot>div');
function setFoot(html){ if(!html){ foot.hidden=true; footIn.innerHTML=''; return null; } foot.hidden=false; footIn.innerHTML=html; return footIn; }
function header(sc){
  const mid = $('#hmid');
  $('#back').hidden = cur===0 || sc.noBack;
  if(sc.sec){
    const keys = Object.keys(SECTIONS);
    const segs = keys.map(k=>{
      const list = S.filter(x=>x.sec===k), done = list.filter(x=>S.indexOf(x)<cur).length;
      const pct = keys.indexOf(k) < keys.indexOf(sc.sec) ? 100 : k===sc.sec ? Math.max(8, done/list.length*100) : 0;
      return `<i><b style="width:${pct}%"></b></i>`;
    }).join('');
    mid.innerHTML = `<div class="sec">${SECTIONS[sc.sec]}</div><div class="prog">${segs}</div>`;
  } else mid.innerHTML = `<div class="brand">${esc(CONFIG.brand)}</div>`;
}
function go(i, push=true){
  while(S[i] && S[i].skip && S[i].skip()) i++;
  if(push) hist.push(cur);
  cur = i; const sc = S[i];
  header(sc); setFoot(null);
  main.innerHTML = `<div class="screen" id="scr"></div>`;
  window.scrollTo(0,0);
  R[sc.type](sc, $('#scr'));
}
const next = () => go(cur+1);
$('#back').onclick = () => { if(hist.length){ go(hist.pop(), false); } };

    arc.setAttribute('stroke-dashoffset',276.5*(1-e)); pct.textContent=Math.round(e*100)+'%';
    rows.forEach((r,i)=>r.classList.toggle('done', e>=(i+1)/rows.length-0.01));
    if(T.length){ const k=Math.min(T.length-1,Math.floor(p*T.length)); if(k!==ti){ ti=k; const t=T[k]; $('#tst',el).innerHTML=`<div class="tst"><div class="stars">★★★★★</div><b>${esc(t.title||'')}</b><p style="font-size:14px;color:#44444C;margin-top:4px">${esc(t.text)}</p><p style="font-size:13px;color:var(--muted);margin-top:6px">${esc(t.name)}</p></div>`; } }
    if(p<1) requestAnimationFrame(tick); else setTimeout(next,500);
  })(t0);
 },
 email(sc, el){
  el.innerHTML = `<h1 class="i">Enter your email to get your <span style="color:var(--pink)">${esc(CONFIG.product)} Plan</span></h1><input type="email" class="field" id="em" placeholder="Your email" autocomplete="email" value="${esc(D.email||'')}"><p class="privacy">🔒 <span>We respect your privacy and are committed to protecting your personal data. Your data will be processed in accordance with our <a href="${CONFIG.privacyUrl}" target="_blank">Privacy Policy</a>.</span></p>`;
  const inp=$('#em',el), b=cta('Continue',()=>{ D.email=inp.value.trim(); next(); },true);
  const chk=()=>{ b.disabled=!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim()); };
  inp.oninput=chk; chk(); inp.focus();
 },
 name(sc, el){
  el.innerHTML = `<h1 class="q">What's your name?</h1><input class="field" id="nm" placeholder="Name" autocomplete="given-name" value="${esc(D.name||'')}">`;
  const inp=$('#nm',el), b=cta('Continue',()=>{ D.name=inp.value.trim(); sendLead(); next(); },true);
  inp.oninput=()=>{ b.disabled=!inp.value.trim(); }; inp.oninput(); inp.focus();
 },
 ready(sc, el){
  const after=Math.max(D.goalKg, D.weightKg - 7*0.7), d=new Date(); d.setDate(d.getDate()+49);
  el.innerHTML = `<h1 class="q">${esc(D.name)}, your 7-week ${esc(CONFIG.product)} Plan is ready!</h1>
   <div class="chart"><div style="font-weight:700;font-size:14px;padding:2px 8px 6px">Your Weight</div>${chart(D.weightKg, after, 'Today', fmtDate(d))}</div><p class="note">This chart is for illustrative purposes only</p>`;
  cta('Continue', next);
 },
 scratch(sc, el){
  el.innerHTML = `<h1 class="q">Scratch to reveal your special discount!</h1><p class="sub">We want you to start your journey with a nice surprise</p>
   <div class="scratch"><div class="prize"><b>50%</b><span>OFF</span><small style="color:var(--muted);margin-top:8px">your ${esc(CONFIG.product)} Plan</small></div><canvas width="220" height="280"></canvas></div>`;
  const cv=$('canvas',el), ctx=cv.getContext('2d');
  ctx.fillStyle='#F45B9B'; ctx.beginPath(); ctx.roundRect(0,0,220,280,18); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='600 18px Inter, sans-serif'; ctx.textAlign='center'; ctx.fillText('Scratch it off',110,70);
  ctx.font='54px sans-serif'; ctx.fillText('👆',110,150);
  ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(14,210); ctx.lineTo(206,210); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=40; ctx.lineCap='round'; ctx.lineJoin='round';
  let down=false, last=null, done=false;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*220/r.width,(e.clientY-r.top)*280/r.height]; };
  cv.onpointerdown=e=>{ down=true; last=pt(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove=e=>{ if(!down||done) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; };
  cv.onpointerup=()=>{ down=false; check(); };
  function check(){
    const d=ctx.getImageData(0,0,220,280).data; let clear=0; for(let i=3;i<d.length;i+=16) if(d[i]===0) clear++;
    if(clear/(d.length/16)>0.45 && !done){ done=true; cv.style.transition='opacity .4s'; cv.style.opacity=0; setTimeout(reveal,450); }
  }
  function reveal(){
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="box"><div style="font-size:40px">🎉</div><h3>Woo-hoo!</h3><p style="color:#55555E">You've unlocked a special discount</p><div class="big">50% OFF</div><p style="color:var(--muted);font-size:13px;margin:6px 0 20px">Your discount is applied to your plan</p><button class="btn">Get my plan</button></div>`;
    document.body.appendChild(m); $('.btn',m).onclick=goCheckout;
  }
 }
};

function chart(start, end, l1, l2){
  const down = end < start, y1=down?40:120, y2=down?140:60;
  const path=`M30,${y1} C110,${y1} 190,${y2} 290,${y2}`;
  return `<svg viewBox="0 0 320 200" font-family="Inter,sans-serif"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F45B9B" stop-opacity=".25"/><stop offset="1" stop-color="#F45B9B" stop-opacity="0"/></linearGradient><linearGradient id="cl" x1="0" x2="1"><stop offset="0" stop-color="#FA8F5A"/><stop offset=".5" stop-color="#FAB005"/><stop offset="1" stop-color="#22B07D"/></linearGradient></defs>
   ${[40,90,140].map(y=>`<line x1="20" x2="300" y1="${y}" y2="${y}" stroke="#F0F0F3" stroke-dasharray="4 4"/>`).join('')}
   <path d="${path} L290,170 L30,170Z" fill="url(#cg)"/><path d="${path}" fill="none" stroke="url(#cl)" stroke-width="4" stroke-linecap="round"/>
   <circle cx="30" cy="${y1}" r="7" fill="#fff" stroke="#FA8F5A" stroke-width="4"/><circle cx="290" cy="${y2}" r="7" fill="#fff" stroke="#22B07D" stroke-width="4"/>
   <rect x="40" y="${y1-34}" width="74" height="24" rx="8" fill="#1E1E24"/><text x="77" y="${y1-17}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${fmtW(start)}</text>
   <rect x="208" y="${y2-36}" width="80" height="26" rx="8" fill="#F45B9B"/><text x="248" y="${y2-18}" fill="#fff" font-size="12.5" font-weight="800" text-anchor="middle">${fmtW(end)}</text>
   <text x="30" y="190" font-size="11" fill="#7A7A85" text-anchor="start">${l1}</text><text x="290" y="190" font-size="11" fill="#7A7A85" text-anchor="end">${l2}</text></svg>`;
}

function payload(){
  return { name:D.name, email:D.email, ageGroup:D.a.age, age:D.age, heightCm:Math.round(D.heightCm), weightKg:+D.weightKg.toFixed(1), goalKg:+D.goalKg.toFixed(1),
    unitW:D.unitW, bmi:+bmi().toFixed(1), build:D.a.build, dream:D.a.dream, goal:D.a.goal, zones:D.a.zones, answers:D.a, eventDate:D.eventDate||'' };
}
function sendLead(){
  if(!CONFIG.leadWebhook) return;
  try{ fetch(CONFIG.leadWebhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign(payload(),{page:location.href}))}); }catch(e){}
}
function goCheckout(){
  const p=payload();
  try{ localStorage.setItem('hsp_quiz', JSON.stringify(p)); }catch(e){}
  const u=new URL(CONFIG.checkoutPage, location.href);
  new URLSearchParams(location.search).forEach((v,k)=>u.searchParams.set(k,v));   // mantém UTMs
  u.searchParams.set('hsp', JSON.stringify({name:p.name,email:p.email,weightKg:p.weightKg,goalKg:p.goalKg,unitW:p.unitW,bmi:p.bmi,build:p.build,dream:p.dream}));
  location.href=u.toString();
}

go(0, false);
})();
</script>
</body>
</html>
